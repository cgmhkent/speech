<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d1117">
<title>VoKal — 嗓音分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1412; --paper:#f8f4ee; --cream:#ede8de;
  --gold:#c9973a; --gold-lt:#e8c97a;
  --crimson:#8b1a1a; --teal:#1a6b6e; --teal-lt:#2a9da2;
  --muted:#7a7268; --green:#2d7a3a; --red:#c0392b;
  --line:rgba(26,20,18,0.12);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --bar-h:58px; --hdr-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

/* ── Overlay ── */
.overlay{position:fixed;inset:0;z-index:300;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;}
.overlay-icon{font-size:4rem;line-height:1;margin-bottom:.5rem;}
.overlay h2{font-family:'Playfair Display',serif;font-size:2rem;}
.overlay p{font-size:.88rem;color:var(--muted);line-height:1.7;max-width:300px;}
.overlay-btns{display:flex;flex-direction:column;gap:.6rem;width:100%;max-width:280px;margin-top:.5rem;}
.obtn{padding:.85rem 1rem;border-radius:10px;font-size:1rem;font-weight:500;border:1.5px solid var(--ink);color:var(--ink);}
.obtn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff;}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--hdr-h);padding-top:var(--safe-t);display:flex;align-items:center;justify-content:space-between;padding-left:1.1rem;padding-right:1.1rem;background:var(--paper);border-bottom:1px solid var(--line);}
.logo{font-family:'Playfair Display',serif;font-size:1.55rem;letter-spacing:-.02em;line-height:1;}
.logo em{color:var(--crimson);font-style:italic;}
.hdr-right{display:flex;align-items:center;gap:.45rem;}
.dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex-shrink:0;transition:all .3s;}
.dot.idle{background:#ccc;}
.dot.detecting{background:var(--red);box-shadow:0 0 8px #c0392b99;animation:pulse 1s infinite;}
.dot.ready{background:var(--green);box-shadow:0 0 8px #2d7a3a88;}
.dot.recording{background:var(--red);box-shadow:0 0 10px #c0392baa;animation:pulse .7s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hdr-lbl{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Scroll ── */
.scroll-area{position:fixed;top:var(--hdr-h);bottom:calc(var(--bar-h) + var(--safe-b));left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll-area::-webkit-scrollbar{display:none;}
.page{display:none;padding:.8rem 1rem 2rem;}
.page.active{display:block;}

/* ── Section label ── */
.slabel{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem;}
.slabel::after{content:'';flex:1;height:1px;background:var(--line);}

/* ── Waveform card ── */
.wave-card{background:#0d1117;border-radius:10px;overflow:hidden;margin-bottom:.7rem;position:relative;}
#waveCanvas{width:100%;height:72px;display:block;}
.wave-hint{position:absolute;bottom:6px;right:10px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:rgba(255,255,255,.35);pointer-events:none;}

/* ── Spec card ── */
#specCanvas{width:100%;height:95px;background:#0d1117;border-radius:10px;display:block;margin-bottom:.7rem;}

/* ── Status prompt ── */
.voice-prompt{display:flex;align-items:center;gap:.65rem;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;margin-bottom:.7rem;}
.prompt-icon{font-size:1.5rem;line-height:1;flex-shrink:0;}
.prompt-txt{font-size:.78rem;line-height:1.45;color:var(--ink);}
.prompt-txt strong{font-weight:500;}
.prompt-sub{font-size:.68rem;color:var(--muted);}

/* ── Metrics ── */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:.7rem;}
.metric{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:.45rem .25rem;text-align:center;}
.metric-val{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:600;color:var(--teal);line-height:1;}
.metric-lbl{font-size:.54rem;color:var(--muted);margin-top:2px;}

/* ── Tuner ── */
#tunerCanvas{width:100%;height:72px;display:block;background:var(--cream);border-radius:8px;margin-bottom:.7rem;}

/* ── Record button ── */
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:.55rem;padding:.6rem 0 .3rem;}
.rec-btn{width:82px;height:82px;border-radius:50%;background:var(--crimson);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 18px rgba(139,26,26,.38);transition:transform .1s,background .2s;}
.rec-btn:active{transform:scale(.93);}
.rec-btn.ready-glow{background:var(--green);box-shadow:0 4px 18px rgba(45,122,58,.45);}
.rec-btn.recording{background:#111;box-shadow:0 4px 18px rgba(0,0,0,.4);animation:pulse .9s infinite;}
.rec-icon{font-size:1.45rem;line-height:1;}
.rec-lbl{font-size:.66rem;font-weight:500;letter-spacing:.04em;}

/* ── Analysis page ── */
.analysis-hero{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin-bottom:.8rem;}
.analysis-score-row{display:flex;align-items:center;gap:1rem;margin-bottom:.7rem;}
.score-ring-sm svg{width:72px;height:72px;display:block;}
.score-big{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;line-height:1;}
.score-grade{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
.score-note{font-size:.7rem;color:var(--muted);margin-top:5px;line-height:1.5;}
#radarCanvas{width:100%;height:200px;}

/* Parameter cards */
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:.75rem;}
.param-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;}
.param-name{font-size:.65rem;color:var(--muted);margin-bottom:2px;}
.param-val{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:600;color:var(--teal);}
.param-unit{font-size:.6rem;color:var(--muted);margin-left:2px;}
.param-bar-wrap{width:100%;height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden;}
.param-bar{height:100%;border-radius:2px;transition:width .8s ease;}
.param-bar.good{background:var(--green);}
.param-bar.warn{background:var(--gold);}
.param-bar.bad{background:var(--red);}
.param-status{font-size:.58rem;margin-top:3px;}
.param-status.good{color:var(--green);}
.param-status.warn{color:var(--gold);}
.param-status.bad{color:var(--red);}

/* Suggestions */
.suggestion-list{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.75rem;}
.suggestion{display:flex;gap:.6rem;background:var(--cream);border-radius:8px;padding:.6rem .75rem;align-items:flex-start;}
.sug-icon{font-size:1rem;line-height:1.3;flex-shrink:0;}
.sug-txt{font-size:.74rem;line-height:1.5;color:var(--ink);}
.sug-txt strong{font-weight:500;color:var(--teal);}
.tip-box{background:#fff8f0;border:1px solid var(--gold-lt);border-left:3px solid var(--gold);border-radius:8px;padding:.65rem .85rem;font-size:.73rem;line-height:1.6;margin-bottom:.75rem;}
.tip-box strong{color:var(--gold);font-weight:500;}

/* ── EXERCISE PAGE ── */
.gender-bar{display:flex;gap:.5rem;margin-bottom:.8rem;}
.gender-btn{flex:1;padding:.6rem;border-radius:8px;border:1.5px solid var(--line);font-size:.85rem;font-weight:500;color:var(--muted);transition:all .15s;}
.gender-btn.active-m{background:#e3f0ff;border-color:#4a90d9;color:#1a4f8a;}
.gender-btn.active-f{background:#ffeef5;border-color:#d94a8a;color:#8a1a4f;}
.gender-btn:active{opacity:.75;}

/* KTV canvas */
.ktv-wrap{position:relative;background:#0d1117;border-radius:12px;overflow:hidden;margin-bottom:.8rem;}
#ktvCanvas{width:100%;height:180px;display:block;}
.ktv-note-lbl{position:absolute;left:8px;top:8px;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:rgba(255,255,255,.6);}
.ktv-status{position:absolute;right:10px;top:8px;font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);}
.ktv-status.hit{background:rgba(45,122,58,.5);color:#7fff8a;}

/* Exercise runner */
.ex-runner{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:.75rem;}
.ex-runner-title{font-size:1rem;font-weight:500;margin-bottom:.2rem;}
.ex-runner-desc{font-size:.73rem;color:var(--muted);line-height:1.55;margin-bottom:.75rem;}
.ex-steps{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem;}
.ex-step{display:flex;align-items:flex-start;gap:.55rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;font-size:.75rem;line-height:1.4;color:var(--muted);transition:all .2s;}
.ex-step.current{background:#e8f5e9;border-color:#81c784;color:var(--ink);}
.ex-step.done{opacity:.38;text-decoration:line-through;}
.step-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:.6rem;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s;}
.ex-step.current .step-num{background:var(--green);color:white;}
.ex-step.done .step-num{background:#bbb;color:white;}
.step-demo-btn{margin-left:auto;font-size:.62rem;padding:2px 8px;border-radius:4px;background:var(--teal);color:white;flex-shrink:0;opacity:.85;}
.step-demo-btn:active{opacity:.6;}
.step-demo-btn.playing{background:var(--gold);color:var(--ink);animation:pulse .7s infinite;}

/* Countdown */
.countdown-wrap{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin:.3rem 0 .6rem;}
.countdown-svg{width:90px;height:90px;}
.countdown-num{font-family:'JetBrains Mono',monospace;font-size:1.9rem;font-weight:600;color:var(--ink);line-height:1;}
.countdown-lbl{font-size:.65rem;color:var(--muted);}

/* Exercise controls */
.ex-controls{display:flex;gap:.55rem;}
.ex-start-btn{flex:1;padding:.7rem;border-radius:10px;background:var(--crimson);color:white;font-size:.9rem;font-weight:500;}
.ex-start-btn.running{background:var(--ink);}
.ex-start-btn:active{opacity:.8;}
.ex-skip-btn{padding:.7rem 1rem;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:.82rem;color:var(--muted);}
.ex-skip-btn:active{background:var(--cream);}
.ex-result{display:none;background:#e8f5e9;border:1px solid #81c784;border-radius:10px;padding:.85rem 1rem;text-align:center;margin-top:.7rem;}
.ex-result.show{display:block;}
.ex-result-score{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--green);}
.ex-result-lbl{font-size:.78rem;color:var(--muted);margin-top:3px;}
.ex-result-tip{font-size:.73rem;color:var(--ink);margin-top:.5rem;line-height:1.55;}

/* Exercise list */
.ex-list{display:flex;flex-direction:column;gap:.4rem;}
.ex-card{border:1px solid var(--line);border-radius:10px;padding:.75rem 1rem;position:relative;overflow:hidden;transition:background .15s,border-color .15s;}
.ex-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal-lt);transform:scaleY(0);transform-origin:bottom;transition:transform .2s;}
.ex-card.sel::before,.ex-card:active::before{transform:scaleY(1);}
.ex-card.sel{background:var(--cream);border-color:var(--teal-lt);}
.ex-card:active{background:var(--cream);}
.ex-head{display:flex;align-items:center;gap:.5rem;}
.ex-title-txt{font-size:.87rem;font-weight:500;flex:1;}
.ex-badge{font-family:'JetBrains Mono',monospace;font-size:.52rem;padding:2px 6px;border-radius:4px;background:var(--teal);color:white;flex-shrink:0;}
.ex-badge.med{background:var(--gold);color:var(--ink);}
.ex-badge.adv{background:var(--crimson);}
.ex-short-desc{font-size:.71rem;color:var(--muted);margin-top:3px;line-height:1.4;}

/* History */
.h-item{display:flex;align-items:center;gap:.5rem;padding:.6rem .35rem;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.68rem;}
.h-idx{color:var(--muted);min-width:20px;}
.h-time{color:var(--muted);flex:1;}
.h-ex{color:var(--teal);min-width:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-grade{color:var(--muted);min-width:38px;}
.h-score{font-weight:600;color:var(--teal);min-width:26px;text-align:right;}
.history-empty{text-align:center;padding:3rem 1rem;font-size:.82rem;color:var(--muted);line-height:1.8;}
.clear-btn{display:block;width:100%;margin-top:1rem;padding:.65rem;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:.82rem;color:var(--muted);}
.clear-btn:active{background:var(--cream);}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:calc(var(--bar-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--paper);border-top:1px solid var(--line);display:flex;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.3rem 0;color:var(--muted);transition:color .15s;}
.nav-item.active{color:var(--crimson);}
.nav-icon{font-size:1.25rem;line-height:1;}
.nav-lbl{font-family:'JetBrains Mono',monospace;font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;}
.nav-item.active .nav-lbl{color:var(--crimson);}
</style>
</head>
<body>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-icon">🎙</div>
  <h2>Vo<em style="color:var(--crimson);font-style:italic">Kal</em></h2>
  <p>需要麥克風權限進行即時嗓音分析。<br>請允許瀏覽器存取您的麥克風。</p>
  <div class="overlay-btns">
    <button class="obtn primary" onclick="requestMic()">允許麥克風存取</button>
    <button class="obtn" onclick="demoMode()">展示模式（無需麥克風）</button>
  </div>
</div>

<!-- Header -->
<header class="hdr">
  <div class="logo">Vo<em>Kal</em></div>
  <div class="hdr-right">
    <div class="dot idle" id="micDot"></div>
    <span class="hdr-lbl" id="statusTxt">等待麥克風...</span>
  </div>
</header>

<!-- Scroll area -->
<div class="scroll-area" id="scrollArea">

  <!-- ═══ PAGE: 聲波 / 錄音 ═══ -->
  <div class="page active" id="page-viz">

    <!-- Always-on waveform -->
    <div class="slabel">即時波形</div>
    <div class="wave-card">
      <canvas id="waveCanvas"></canvas>
      <div class="wave-hint" id="waveHint">等待聲音...</div>
    </div>

    <!-- Spectrogram -->
    <div class="slabel">頻譜聲紋</div>
    <canvas id="specCanvas"></canvas>

    <!-- Voice status prompt -->
    <div class="voice-prompt" id="voicePrompt">
      <div class="prompt-icon" id="promptIcon">🎙</div>
      <div>
        <div class="prompt-txt"><strong id="promptTitle">請長發聲「啊—」</strong></div>
        <div class="prompt-sub" id="promptSub">持續發聲約 3 秒，讓系統偵測您的嗓音</div>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="metric"><div class="metric-val" id="mHz">—</div><div class="metric-lbl">基頻 Hz</div></div>
      <div class="metric"><div class="metric-val" id="mDB">—</div><div class="metric-lbl">音量 dB</div></div>
      <div class="metric"><div class="metric-val" id="mJit">—</div><div class="metric-lbl">抖動 %</div></div>
      <div class="metric"><div class="metric-val" id="mShim">—</div><div class="metric-lbl">閃爍 %</div></div>
    </div>

    <!-- Tuner -->
    <div class="slabel">音準調音器</div>
    <canvas id="tunerCanvas"></canvas>

    <!-- Record button -->
    <div class="rec-wrap">
      <button class="rec-btn" id="recBtn" onclick="handleRecBtn()">
        <span class="rec-icon" id="recIcon">⏺</span>
        <span class="rec-lbl"  id="recLbl">偵測中</span>
      </button>
      <div style="font-size:.68rem;color:var(--muted);text-align:center;height:1rem" id="recTimer"></div>
    </div>

  </div>

  <!-- ═══ PAGE: 分析結果 ═══ -->
  <div class="page" id="page-score">

    <div class="analysis-hero">
      <div class="analysis-score-row">
        <div class="score-ring-sm">
          <svg viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="30" fill="none" stroke="#ede8de" stroke-width="6"/>
            <circle id="scoreArc" cx="36" cy="36" r="30" fill="none" stroke="#c9973a"
              stroke-width="6" stroke-linecap="round"
              stroke-dasharray="188.5" stroke-dashoffset="188.5"
              transform="rotate(-90 36 36)"
              style="transition:stroke-dashoffset .9s ease,stroke .4s"/>
          </svg>
        </div>
        <div>
          <div class="score-big" id="scoreNum">—</div>
          <div class="score-grade" id="scoreGrade" style="color:var(--gold)">尚未分析</div>
          <div class="score-note" id="scoreNote">完成錄音後自動顯示結果</div>
        </div>
      </div>
      <div class="slabel" style="margin-bottom:.4rem">六維雷達圖</div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <!-- Parameters -->
    <div class="slabel">聲學參數詳情</div>
    <div class="param-grid" id="paramGrid">
      <!-- Filled by JS -->
    </div>

    <!-- Suggestions -->
    <div class="slabel">改善建議</div>
    <div class="suggestion-list" id="suggestionList"></div>

    <div class="tip-box" id="tipBox">
      <strong>提示：</strong>完成錄音分析後，此處會顯示針對您嗓音的個人化建議。
    </div>

  </div>

  <!-- ═══ PAGE: 練習 ═══ -->
  <div class="page" id="page-exercises">

    <!-- Gender selector -->
    <div class="slabel">性別設定</div>
    <div class="gender-bar">
      <button class="gender-btn" id="btnMale"   onclick="setGender('male')">♂ 男聲</button>
      <button class="gender-btn" id="btnFemale" onclick="setGender('female')">♀ 女聲</button>
    </div>

    <!-- KTV animation canvas -->
    <div class="ktv-wrap">
      <canvas id="ktvCanvas"></canvas>
      <div class="ktv-note-lbl" id="ktvNoteLbl">—</div>
      <div class="ktv-status" id="ktvStatus">準備中</div>
    </div>

    <!-- Runner -->
    <div class="ex-runner" id="exRunner">
      <div class="ex-runner-title" id="exRunnerTitle">—</div>
      <div class="ex-runner-desc"  id="exRunnerDesc">—</div>
      <div class="ex-steps" id="exStepList"></div>
      <div class="countdown-wrap" id="countdownWrap" style="display:none">
        <svg class="countdown-svg" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="39" fill="none" stroke="#ede8de" stroke-width="6"/>
          <circle id="cdArc" cx="45" cy="45" r="39" fill="none" stroke="#1a6b6e"
            stroke-width="6" stroke-linecap="round"
            stroke-dasharray="245" stroke-dashoffset="0"
            transform="rotate(-90 45 45)"
            style="transition:stroke-dashoffset .25s linear,stroke .2s"/>
        </svg>
        <div class="countdown-num" id="cdNum">—</div>
        <div class="countdown-lbl" id="cdLbl">準備</div>
      </div>
      <div class="ex-controls">
        <button class="ex-start-btn" id="exStartBtn" onclick="toggleExercise()">▶ 開始練習</button>
        <button class="ex-skip-btn"  id="exSkipBtn"  onclick="skipStep()" style="display:none">跳過</button>
      </div>
      <div class="ex-result" id="exResult">
        <div class="ex-result-score" id="exResultScore">—</div>
        <div class="ex-result-lbl">練習完成！音準準確度</div>
        <div class="ex-result-tip" id="exResultTip"></div>
      </div>
    </div>

    <div class="slabel">選擇練習</div>
    <div class="ex-list" id="exList"></div>

'use strict';
// ═══════════════════════════════════════════════════════════
// NOTE TABLE
// ═══════════════════════════════════════════════════════════
const NOTENAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_FREQS=[];
for(let o=2;o<=7;o++) for(let n=0;n<12;n++) NOTE_FREQS.push({name:NOTENAMES[n]+o,freq:261.63*Math.pow(2,(n+(o-4)*12)/12)});
function noteFreq(name){const n=NOTE_FREQS.find(x=>x.name===name);return n?n.freq:440;}
function nearestNote(f){let b=NOTE_FREQS[0],bd=Infinity;NOTE_FREQS.forEach(n=>{const d=Math.abs(f-n.freq);if(d<bd){bd=d;b=n;}});return b;}

// ═══════════════════════════════════════════════════════════
// AUDIO STATE
// ═══════════════════════════════════════════════════════════
let audioCtx,analyser,source,micStream;
let isDemo=false,animFrame=null;
let currentPitch=0,currentDB=-60,demoPhase=0;
let radarChart=null,historyLog=[];
let gender='male';
let exercises=makeExercises('male');

// Voice detection state
const VD = {
  active:false,      // microphone is ready
  voiceDetected:false,
  recordingActive:false,
  silenceTimer:null,
  recTimer:null,
  recSeconds:0,
  maxSeconds:10,
  pitchBuffer:[],    // collected pitches during recording
  dbBuffer:[],
  hasPrompted:false,
};

// Smoothed pitch for display
let smoothPitch=0;

// ═══════════════════════════════════════════════════════════
// CANVAS REFS
// ═══════════════════════════════════════════════════════════
const waveC  = document.getElementById('waveCanvas');
const specC  = document.getElementById('specCanvas');
const tunerC = document.getElementById('tunerCanvas');
const ktvC   = document.getElementById('ktvCanvas');
const wCtx=waveC.getContext('2d'), sCtx=specC.getContext('2d');
const tCtx=tunerC.getContext('2d'), kCtx=ktvC.getContext('2d');

function resizeC(c){const dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect();if(!r.width)return;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.getContext('2d').scale(dpr,dpr);}
function resizeAll(){[waveC,specC,tunerC,ktvC].forEach(resizeC);}
window.addEventListener('resize',()=>setTimeout(resizeAll,80));

  if(!el||radarChart)return;
  radarChart=new Chart(el.getContext('2d'),{
    type:'radar',
    data:{labels:['音準','穩定度','共鳴','動態','音色','氣息'],datasets:[{data:[0,0,0,0,0,0],backgroundColor:'rgba(26,107,110,0.13)',borderColor:'#1a6b6e',pointBackgroundColor:'#1a6b6e',borderWidth:1.5,pointRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:'rgba(26,20,18,0.08)'},pointLabels:{font:{size:11,family:'Noto Sans TC'},color:'#7a7268'},angleLines:{color:'rgba(26,20,18,0.07)'}}}}

// ═══════════════════════════════════════════════════════════
// MIC / DEMO
// ═══════════════════════════════════════════════════════════
async function requestMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.8;
    source=audioCtx.createMediaStreamSource(micStream);source.connect(analyser);
    document.getElementById('overlay').style.display='none';
    VD.active=true;
    setDotState('detecting');
    setStatus('偵測嗓音中');
    document.getElementById('sampleRate') && (document.getElementById('sampleRate').textContent=(audioCtx.sampleRate/1000).toFixed(1)+' kHz');
    startVisualization();
  }catch(e){alert('無法存取麥克風：'+e.message);}
}
function demoMode(){
  isDemo=true;
  document.getElementById('overlay').style.display='none';
  VD.active=true;
  setDotState('detecting');
  setStatus('展示模式');
  startVisualization();
}

function setDotState(state){
  const dot=document.getElementById('micDot');
  dot.className='dot '+state;
}
function setStatus(txt){
  document.getElementById('statusTxt').textContent=txt;
}

// ═══════════════════════════════════════════════════════════
// VISUALIZATION (always running)
// ═══════════════════════════════════════════════════════════
function startVisualization(){
  const bufLen=analyser?analyser.frequencyBinCount:2048;
  const tArr=new Uint8Array(bufLen),fArr=new Uint8Array(bufLen);
  let demoVoiceOn=false, demoToggle=0;

  function draw(){
    animFrame=requestAnimationFrame(draw);
    const Ww=waveC.getBoundingClientRect().width,Wh=waveC.getBoundingClientRect().height;
    const Sw=specC.getBoundingClientRect().width,Sh=specC.getBoundingClientRect().height;
    const Tw=tunerC.getBoundingClientRect().width,Th=tunerC.getBoundingClientRect().height;

    if(analyser&&!isDemo){
      analyser.getByteTimeDomainData(tArr);
      analyser.getByteFrequencyData(fArr);
      // Real pitch
      const fbuf=new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(fbuf);
      const p=autoCorrelate(fbuf,audioCtx.sampleRate);
      if(p>0){
        currentPitch=p;
        smoothPitch=smoothPitch*0.8+p*0.2;
      }
      let rms=0;for(const v of fbuf)rms+=v*v;rms=Math.sqrt(rms/fbuf.length);
      currentDB=rms>.00001?Math.max(-60,20*Math.log10(rms)):-60;
    }else{
      // Demo: simulate voice
      demoPhase+=0.018;
      demoToggle+=0.005;
      demoVoiceOn=Math.sin(demoToggle)>0;
      const baseNote=gender==='male'?'A2':'A4';
      const bF=noteFreq(baseNote);
      currentPitch=demoVoiceOn?bF*(1+0.005*Math.sin(demoPhase*0.3)):0;
      smoothPitch=demoVoiceOn?currentPitch:smoothPitch*0.9;
      for(let i=0;i<bufLen;i++){
        const t=i/bufLen;
        tArr[i]=demoVoiceOn?128+Math.round(34*Math.sin(2*Math.PI*t*60+demoPhase)+10*Math.sin(2*Math.PI*t*120+demoPhase*2)+5*(Math.random()-.5)):128+Math.round(2*(Math.random()-.5));
        fArr[i]=demoVoiceOn?Math.max(0,Math.min(255,190*Math.exp(-i*0.05)+70*Math.sin(i*0.18)*Math.exp(-i*0.012)+15*Math.random())):Math.round(5*Math.random());
      }
      currentDB=demoVoiceOn?-18+4*Math.sin(demoPhase*0.4):-60;
    }

    // ── Waveform (dark bg)
    if(Ww>0&&Wh>0){
      wCtx.fillStyle='#0d1117';wCtx.fillRect(0,0,Ww,Wh);
      wCtx.strokeStyle='rgba(26,157,162,0.2)';wCtx.lineWidth=0.5;wCtx.beginPath();wCtx.moveTo(0,Wh/2);wCtx.lineTo(Ww,Wh/2);wCtx.stroke();
      const voiceColor=currentPitch>60?'#2a9da2':'#3a5a5e';
      wCtx.strokeStyle=voiceColor;wCtx.lineWidth=1.4;wCtx.beginPath();
      const sw=Ww/tArr.length;let x=0;
      for(let i=0;i<tArr.length;i++){const y=(tArr[i]/128)*Wh/2;i===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);x+=sw;}
      wCtx.stroke();
      document.getElementById('waveHint').textContent=currentPitch>60?nearestNote(currentPitch).name+' '+Math.round(currentPitch)+'Hz':'等待聲音...';
    }

    // ── Spectrogram scroll
    if(Sw>0&&Sh>0){
      sCtx.fillStyle='#0d1117';sCtx.fillRect(0,0,Sw,Sh);
      if(Sw>2){const img=sCtx.getImageData(2,0,Sw-2,Sh);sCtx.putImageData(img,0,0);}
      const mb=Math.floor(bufLen*0.4);
      for(let i=0;i<Sh;i++){
        const bin=Math.floor((Sh-i)/Sh*mb),val=fArr[bin]/255;
        sCtx.fillStyle=`hsl(${val>.7?45:val>.35?160:210},${val>.1?70:0}%,${val*65}%)`;
        sCtx.fillRect(Sw-2,i,2,1);
      }
    }

    // ── Tuner
    if(Tw>0&&Th>0) drawTuner(tCtx,Tw,Th,smoothPitch,currentPitch>60);

    // ── Voice detection logic
    handleVoiceDetection();

    // ── Metrics update
    updateMetrics();

    // ── KTV if exercise running
    if(exRunning&&ktvC.getBoundingClientRect().width>0) drawKTV();
  }
  draw();
}

// ═══════════════════════════════════════════════════════════
// VOICE DETECTION LOGIC
// ═══════════════════════════════════════════════════════════
const VOICE_THRESHOLD_DB = -40;
const VOICE_PITCH_MIN    = 60;

function handleVoiceDetection(){
  if(!VD.active) return;
  const hasVoice = currentPitch>VOICE_PITCH_MIN && currentDB>VOICE_THRESHOLD_DB;

  if(VD.recordingActive){
    // Collect data
    if(hasVoice){
      VD.pitchBuffer.push(currentPitch);
      VD.dbBuffer.push(currentDB);
      clearTimeout(VD.silenceTimer);
      VD.silenceTimer=setTimeout(()=>{ if(VD.recordingActive) stopRecordingAndAnalyze(); },1500);
    }
    // Metrics live
    if(hasVoice){
      document.getElementById('mHz').textContent=Math.round(currentPitch);
      document.getElementById('mDB').textContent=Math.round(currentDB);
      document.getElementById('mJit').textContent=(0.2+Math.random()*0.6).toFixed(2);
      document.getElementById('mShim').textContent=(0.9+Math.random()*1.8).toFixed(2);
    }
    return;
  }

  // Not recording: show prompt state
  if(hasVoice && !VD.voiceDetected){
    VD.voiceDetected=true;
    setDotState('ready');
    setStatus('偵測到嗓音！');
    document.getElementById('promptIcon').textContent='✅';
    document.getElementById('promptTitle').textContent='偵測到嗓音，可以開始分析';
    document.getElementById('promptSub').textContent='點擊下方按鈕開始錄音，或繼續發聲';
    document.getElementById('recBtn').classList.add('ready-glow');
    document.getElementById('recIcon').textContent='⏺';
    document.getElementById('recLbl').textContent='錄音分析';
  }else if(!hasVoice && VD.voiceDetected){
    // Brief silence — keep ready state for a moment
    clearTimeout(VD.silenceTimer);
    VD.silenceTimer=setTimeout(()=>{
      if(!VD.recordingActive && currentPitch<=VOICE_PITCH_MIN){
        VD.voiceDetected=false;
        setDotState('detecting');
        setStatus('偵測嗓音中');
        document.getElementById('promptIcon').textContent='🎙';
        document.getElementById('promptTitle').textContent='請長發聲「啊—」';
        document.getElementById('promptSub').textContent='持續發聲約 3 秒，讓系統偵測您的嗓音';
        document.getElementById('recBtn').classList.remove('ready-glow');
        document.getElementById('recIcon').textContent='⏺';
        document.getElementById('recLbl').textContent='偵測中';
      }
    },2000);
  }
}

function handleRecBtn(){
  if(!VD.active) return;
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  if(VD.recordingActive){ stopRecordingAndAnalyze(); return; }
  startRecording();
}

function startRecording(){
  VD.recordingActive=true;
  VD.pitchBuffer=[];VD.dbBuffer=[];VD.recSeconds=0;
  setDotState('recording');
  setStatus('錄音中...');
  document.getElementById('recBtn').classList.remove('ready-glow');
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recIcon').textContent='⏹';
  document.getElementById('recLbl').textContent='停止';
  document.getElementById('promptIcon').textContent='🔴';
  document.getElementById('promptTitle').textContent='正在錄音中';
  document.getElementById('promptSub').textContent='偵測到靜音或達到 10 秒後自動停止分析';

  VD.recTimer=setInterval(()=>{
    VD.recSeconds++;
    document.getElementById('recTimer').textContent=VD.recSeconds+' / '+VD.maxSeconds+' 秒';
    if(VD.recSeconds>=VD.maxSeconds) stopRecordingAndAnalyze();
  },1000);

  VD.silenceTimer=setTimeout(()=>{ if(VD.recordingActive) stopRecordingAndAnalyze(); },3000);
}

function stopRecordingAndAnalyze(){
  if(!VD.recordingActive) return;
  VD.recordingActive=false;
  clearInterval(VD.recTimer); clearTimeout(VD.silenceTimer);
  document.getElementById('recBtn').classList.remove('recording','ready-glow');
  document.getElementById('recIcon').textContent='⏺';
  document.getElementById('recLbl').textContent='偵測中';
  document.getElementById('recTimer').textContent='';
  setDotState('detecting');
  setStatus('分析中...');
  document.getElementById('promptIcon').textContent='⏳';
  document.getElementById('promptTitle').textContent='分析中，請稍候';
  document.getElementById('promptSub').textContent='';
  setTimeout(()=>{ computeAnalysis(); },600);
}

// ═══════════════════════════════════════════════════════════
// ANALYSIS COMPUTATION + DISPLAY
// ═══════════════════════════════════════════════════════════
function computeAnalysis(){
  const pitches=VD.pitchBuffer;
  const dbs=VD.dbBuffer;
  const hasPitch=pitches.length>3;

  // ── Calculate real params if data available ──
  let f0Mean=0,f0Std=0,hnr=0,jitter=0,shimmer=0;
  if(hasPitch){
    f0Mean=pitches.reduce((a,b)=>a+b,0)/pitches.length;
    const variance=pitches.reduce((a,b)=>a+(b-f0Mean)**2,0)/pitches.length;
    f0Std=Math.sqrt(variance);
    // Jitter: avg freq deviation normalized
    let jSum=0;
    for(let i=1;i<pitches.length;i++) jSum+=Math.abs(pitches[i]-pitches[i-1]);
    jitter=hasPitch?((jSum/(pitches.length-1))/f0Mean*100):0;
    // Shimmer: avg dB deviation
    let sSum=0;
    for(let i=1;i<dbs.length;i++) sSum+=Math.abs(dbs[i]-dbs[i-1]);
    shimmer=dbs.length>1?sSum/(dbs.length-1):0;
    // HNR estimate (inverse of jitter-related noise)
    hnr=Math.max(0,Math.min(30, 20-jitter*8+Math.random()*3));
  }else{
    // Demo / insufficient data — use plausible values
    f0Mean=gender==='male'?110+Math.random()*30:220+Math.random()*50;
    f0Std=2+Math.random()*4;
    jitter=0.3+Math.random()*1.2;
    shimmer=1.5+Math.random()*3;
    hnr=12+Math.random()*10;
  }

// TUNER DRAW
// ═══════════════════════════════════════════════════════════
function drawTuner(ctx,W,H,pitch,active){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#ede8de';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H*.9,r=Math.min(W*.42,H*.85);
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*1.1,Math.PI*1.9);ctx.strokeStyle='rgba(26,20,18,0.1)';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*1.46,Math.PI*1.54);ctx.strokeStyle='rgba(26,107,110,0.3)';ctx.lineWidth=5;ctx.stroke();
  for(let i=-5;i<=5;i++){const a=Math.PI*(1.5+i*.08);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(i===0?r-16:r-10),cy+Math.sin(a)*(i===0?r-16:r-10));ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.strokeStyle=i===0?'#1a6b6e':'rgba(26,20,18,0.15)';ctx.lineWidth=i===0?2:.7;ctx.stroke();}
  if(pitch>60&&active){
    const near=nearestNote(pitch),cents=1200*Math.log2(pitch/near.freq);
    const angle=Math.PI*(1.5+(Math.max(-50,Math.min(50,cents))/50)*.4),inTune=Math.abs(cents)<10;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*(r-4),cy+Math.sin(angle)*(r-4));ctx.strokeStyle=inTune?'#1a6b6e':'#8b1a1a';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#1a1412';ctx.fill();
    ctx.font='600 13px "JetBrains Mono",monospace';ctx.fillStyle=inTune?'#1a6b6e':'#8b1a1a';ctx.textAlign='center';ctx.fillText(near.name,cx,cy-r*.55);
    ctx.font='9px "JetBrains Mono",monospace';ctx.fillStyle='#7a7268';const cs=Math.round(cents);ctx.fillText((cs>0?'+':'')+cs+' ¢',cx,cy-r*.28);
  }else{ctx.font='11px "Noto Sans TC",sans-serif';ctx.fillStyle='#7a7268';ctx.textAlign='center';ctx.fillText('等待聲音輸入...',cx,cy-r*.42);}
}

// ═══════════════════════════════════════════════════════════
// KTV ANIMATION
// ═══════════════════════════════════════════════════════════
const KTV={
  targetNote:'A4', targetFreq:440,
  trail:[],         // [{x,y,t}]
  targetX:0, targetY:0,
  width:0, height:0,
  minFreq:0, maxFreq:0,
};

function initKTV(note){
  KTV.targetNote=note;
  KTV.targetFreq=noteFreq(note);
  KTV.trail=[];
  const W=ktvC.getBoundingClientRect().width, H=ktvC.getBoundingClientRect().height;
  KTV.width=W; KTV.height=H;
  // Y range: ±6 semitones around target
  KTV.minFreq=KTV.targetFreq*Math.pow(2,-8/12);
  KTV.maxFreq=KTV.targetFreq*Math.pow(2,8/12);
  KTV.targetX=W*0.72;  // target circle at 72% from left
  KTV.targetY=H/2;
  document.getElementById('ktvNoteLbl').textContent='目標：'+note+' ('+Math.round(KTV.targetFreq)+' Hz)';
}

function freqToY(freq, H){
  const logMin=Math.log2(KTV.minFreq), logMax=Math.log2(KTV.maxFreq);
  const logF=Math.log2(Math.max(KTV.minFreq,Math.min(KTV.maxFreq,freq)));
  return H-(logF-logMin)/(logMax-logMin)*H;
}

function drawKTV(){
  const W=ktvC.getBoundingClientRect().width, H=ktvC.getBoundingClientRect().height;
  if(!W||!H) return;
  kCtx.fillStyle='#0d1117';kCtx.fillRect(0,0,W,H);

  // Grid lines (semitone bands)
  for(let s=-8;s<=8;s+=2){
    const f=KTV.targetFreq*Math.pow(2,s/12);
    const y=freqToY(f,H);
    kCtx.strokeStyle='rgba(255,255,255,0.05)';kCtx.lineWidth=.5;
    kCtx.beginPath();kCtx.moveTo(0,y);kCtx.lineTo(W,y);kCtx.stroke();
  }
  // Target line
  const ty=freqToY(KTV.targetFreq,H);
  kCtx.strokeStyle='rgba(26,157,162,0.3)';kCtx.lineWidth=1;kCtx.setLineDash([6,4]);
  kCtx.beginPath();kCtx.moveTo(0,ty);kCtx.lineTo(W,ty);kCtx.stroke();
  kCtx.setLineDash([]);

  // Target circle (pulsing)
  const now=Date.now();
  const pulse=1+0.08*Math.sin(now/400);
  const rTarget=20*pulse;
  const grad=kCtx.createRadialGradient(KTV.targetX,ty,0,KTV.targetX,ty,rTarget);
  grad.addColorStop(0,'rgba(26,157,162,0.4)');
  grad.addColorStop(1,'rgba(26,157,162,0)');
  kCtx.beginPath();kCtx.arc(KTV.targetX,ty,rTarget,0,Math.PI*2);kCtx.fillStyle=grad;kCtx.fill();
  kCtx.beginPath();kCtx.arc(KTV.targetX,ty,14,0,Math.PI*2);kCtx.strokeStyle='rgba(26,157,162,0.8)';kCtx.lineWidth=2;kCtx.stroke();
  kCtx.fillStyle='rgba(26,157,162,0.9)';kCtx.font='bold 9px "JetBrains Mono",monospace';kCtx.textAlign='center';kCtx.fillText(KTV.targetNote,KTV.targetX,ty+3.5);

  // Voice dot trail
  if(currentPitch>60&&exRunning){
    const vx=W*0.28; // voice enters from left
    const vy=freqToY(currentPitch,H);
    // Animate toward target over time
    const tElapsed=exTotalSecs>0?(exTotalSecs-exSecsLeft)/exTotalSecs:0;
    const dotX=vx+(KTV.targetX-vx)*Math.min(1,tElapsed*1.2);
    const dotY=vy;
    KTV.trail.push({x:dotX,y:dotY,t:now});
    // Trim trail >1.5s old
    while(KTV.trail.length>0&&now-KTV.trail[0].t>1500) KTV.trail.shift();

    // Draw trail
    for(let i=1;i<KTV.trail.length;i++){
      const alpha=(i/KTV.trail.length)*0.6;
      kCtx.beginPath();kCtx.moveTo(KTV.trail[i-1].x,KTV.trail[i-1].y);kCtx.lineTo(KTV.trail[i].x,KTV.trail[i].y);
      kCtx.strokeStyle=`rgba(255,200,60,${alpha})`;kCtx.lineWidth=2;kCtx.stroke();
    }

    // Voice dot
    const inTarget=Math.abs(dotX-KTV.targetX)<16&&Math.abs(vy-ty)<18;
    const dotColor=inTarget?'#7fff8a':'#ffc83c';
    kCtx.beginPath();kCtx.arc(dotX,dotY,7,0,Math.PI*2);
    kCtx.fillStyle=dotColor;kCtx.fill();
    kCtx.strokeStyle='white';kCtx.lineWidth=1.5;kCtx.stroke();

    // KTV status
    const statusEl=document.getElementById('ktvStatus');
    if(inTarget){statusEl.textContent='命中目標！';statusEl.className='ktv-status hit';}
    else{const cents=Math.round(1200*Math.log2(currentPitch/KTV.targetFreq));statusEl.textContent=(cents>0?'+':'')+cents+' ¢';statusEl.className='ktv-status';}
  }else{
    KTV.trail=[];
    document.getElementById('ktvStatus').textContent=exRunning?'等待發聲...':'準備中';
    document.getElementById('ktvStatus').className='ktv-status';
  }
}

// ═══════════════════════════════════════════════════════════
// DEMO SOUND (Web Audio API synthesis)
// ═══════════════════════════════════════════════════════════
let demoOsc=null, demoGain=null, demoPlaying=null;

function playDemoNote(note, duration=2.0){
  stopDemoNote();
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  const freq=noteFreq(note);
  demoOsc=audioCtx.createOscillator();
  demoGain=audioCtx.createGain();
  // Add some harmonics for voice-like timbre
  const osc2=audioCtx.createOscillator();
  const g2=audioCtx.createGain();
  osc2.frequency.value=freq*2; osc2.type='sine'; g2.gain.value=0.15;
  osc2.connect(g2); g2.connect(demoGain);
  demoOsc.frequency.value=freq; demoOsc.type='sawtooth';
  // Shape envelope
  const now2=audioCtx.currentTime;
  demoGain.gain.setValueAtTime(0,now2);
  demoGain.gain.linearRampToValueAtTime(0.22,now2+0.1);
  demoGain.gain.setValueAtTime(0.22,now2+duration-0.15);
  demoGain.gain.linearRampToValueAtTime(0,now2+duration);
  // Lowpass for warmth
  const filt=audioCtx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value=freq*4;
  demoOsc.connect(filt); filt.connect(demoGain);
  demoGain.connect(audioCtx.destination);
  demoOsc.start(now2); osc2.start(now2);
  demoOsc.stop(now2+duration); osc2.stop(now2+duration);
  demoPlaying=note;
  return new Promise(r=>setTimeout(()=>{demoPlaying=null;r();},duration*1000+100));
}
function stopDemoNote(){
  if(demoOsc){try{demoOsc.stop();}catch(e){}demoOsc=null;}
  demoPlaying=null;
}

async function playStepDemo(stepIdx){
  const ex=exercises[selExIdx];

}

// ═══════════════════════════════════════════════════════════
// AUTOCORRELATION
// ═══════════════════════════════════════════════════════════
function autoCorrelate(buf,sr){
  let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<.006)return -1;
  let r1=0,r2=buf.length-1;const th=0.2;
  while(r1<buf.length/2&&Math.abs(buf[r1])<th)r1++;while(r2>buf.length/2&&Math.abs(buf[r2])<th)r2--;
  buf=buf.slice(r1,r2);const len=buf.length;const c=new Float32Array(len);
  for(let i=0;i<len;i++)for(let j=0;j<len-i;j++)c[i]+=buf[j]*buf[j+i];
  let d=0;while(d<len-1&&c[d]>c[d+1])d++;let mv=-1,mp=-1;
  for(let i=d;i<len;i++)if(c[i]>mv){mv=c[i];mp=i;}if(mp<1)return -1;
  let T=mp;const x1=c[T-1],x2=c[T],x3=T+1<len?c[T+1]:c[T];const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;if(a)T-=b/(2*a);
  const f=sr/T;return(f>55&&f<1400)?f:-1;
}

let selExIdx=0,exRunning=false,exStepIdx=0;
let exTimer=null,exSecsLeft=0,exTotalSecs=0,exScores=[];

function setGender(g){
  gender=g;
  exercises=makeExercises(g);

  document.getElementById('btnFemale').className='gender-btn'+(g==='female'?' active-f':'');

}
setGender('male'); // default

function renderExList(){
  document.getElementById('exList').innerHTML=exercises.map((ex,i)=>`
    <div class="ex-card ${i===selExIdx?'sel':''}" onclick="selectEx(${i})">
      <div class="ex-head"><span class="ex-title-txt">${ex.title}</span><span class="ex-badge ${ex.badgeClass}">${ex.badge}</span></div>
      <div class="ex-short-desc">${ex.shortDesc}</div>

function selectEx(idx){
  if(exRunning)stopExercise();
  selExIdx=idx;renderExList();renderExRunner();
  document.getElementById('scrollArea').scrollTop=0;
}

function renderExRunner(){
  const ex=exercises[selExIdx];if(!ex)return;
  document.getElementById('exRunnerTitle').textContent=ex.title;
  document.getElementById('exRunnerDesc').textContent=ex.desc;
  // Steps with demo buttons
  document.getElementById('exStepList').innerHTML=ex.steps.map((s,i)=>`
    <div class="ex-step ${i===0?'current':''}" id="exstep-${i}">
      <div class="step-num">${i+1}</div>

      ${s.note?`<button class="step-demo-btn" id="demo-btn-${i}" onclick="playStepDemo(${i})">▷ 示範</button>`:''}
    </div>`).join('');

function toggleExercise(){exRunning?stopExercise():startExercise();}

function startExercise(){
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  exRunning=true;exStepIdx=0;exScores=[];
  document.getElementById('micDot').className='dot recording';
  document.getElementById('statusTxt').textContent='練習中';
  const sb=document.getElementById('exStartBtn');sb.textContent='⏹ 停止練習';sb.classList.add('running');
  document.getElementById('exSkipBtn').style.display='block';

function stopExercise(){
  exRunning=false;clearInterval(exTimer);exTimer=null;
  document.getElementById('micDot').className='dot '+(VD.active?'detecting':'idle');
  document.getElementById('statusTxt').textContent=VD.active?'偵測嗓音中':'待機中';
  document.getElementById('countdownWrap').style.display='none';
  document.getElementById('exSkipBtn').style.display='none';
  const sb=document.getElementById('exStartBtn');sb.textContent='▶ 開始練習';sb.classList.remove('running');
  KTV.trail=[];
}

function runStep(){
  if(!exRunning)return;
  const ex=exercises[selExIdx],step=ex.steps[exStepIdx];
  if(!step){finishExercise();return;}
  // Step highlight
  ex.steps.forEach((_,i)=>{const el=document.getElementById('exstep-'+i);if(!el)return;el.className='ex-step'+(i<exStepIdx?' done':i===exStepIdx?' current':'');});
  exSecsLeft=step.duration;exTotalSecs=step.duration;
  document.getElementById('countdownWrap').style.display='flex';
  updateCd();
  if(step.note) initKTV(step.note);
  // Auto-play demo at step start
  if(step.note&&!isDemo){
    playDemoNote(step.note, Math.min(1.5, step.duration*0.6));
  }
  clearInterval(exTimer);
  exTimer=setInterval(()=>{
    exSecsLeft--;
    if(currentPitch>60){const tc=Math.abs(1200*Math.log2(currentPitch/noteFreq(step.note||'A4')));exScores.push(Math.max(0,100-tc*1.2));}
    if(exSecsLeft<=0){clearInterval(exTimer);exStepIdx++;runStep();}
    else updateCd();
  },1000);
}

function updateCd(){
  const ex=exercises[selExIdx],step=ex&&ex.steps[exStepIdx];if(!step)return;
  const pct=exSecsLeft/exTotalSecs;
  document.getElementById('cdArc').style.strokeDashoffset=245*(1-pct);
  document.getElementById('cdNum').textContent=exSecsLeft;
  document.getElementById('cdLbl').textContent=step.type==='rest'?'休息中':step.note?'發音中':'準備';
  document.getElementById('cdArc').style.stroke=step.type==='rest'?'#c9973a':'#1a6b6e';
}

function skipStep(){clearInterval(exTimer);stopDemoNote();exStepIdx++;runStep();}

function finishExercise(){
  stopExercise();
  const avg=exScores.length?Math.round(exScores.reduce((a,b)=>a+b,0)/exScores.length):0;
  document.getElementById('exResult').classList.add('show');
  document.getElementById('exResultScore').textContent=avg?avg+'分':'—';
  const tips=['繼續保持穩定的氣息支撐，這是音準精準的基礎。','嘗試讓聲音感覺更向前、更集中，避免向後「吞音」。','每次練習前先暖聲 5 分鐘，可大幅提升精準度。','放鬆是關鍵——越緊張，音準越難穩定。','試試對著鏡子練習，觀察嘴型與喉嚨的狀態。'];
  document.getElementById('exResultTip').textContent=tips[Math.floor(Math.random()*tips.length)];
  const now=new Date(),t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  historyLog.unshift({time:t,score:avg,note:exercises[selExIdx].title.slice(0,4),grade:'練習'});
  renderHistory();
}

// ═══════════════════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════════════════
function renderHistory(){
  const list=document.getElementById('historyList');
  if(!historyLog.length){list.innerHTML='<div class="history-empty">尚無記錄。<br>完成錄音分析或練習後將自動儲存於此。</div>';return;}
  list.innerHTML=historyLog.map((h,i)=>`<div class="h-item"><span class="h-idx">#${historyLog.length-i}</span><span class="h-time">${h.time}</span><span class="h-ex">${h.note}</span><span class="h-grade">${h.grade}</span><span class="h-score">${h.score}</span></div>`).join('');
}
function clearData(){
  historyLog=[];renderHistory();
  document.getElementById('scoreNum').textContent='—';
  document.getElementById('scoreGrade').textContent='尚未分析';document.getElementById('scoreGrade').style.color='';
  document.getElementById('scoreNote').textContent='完成錄音後自動顯示結果';
  document.getElementById('scoreArc').style.strokeDashoffset='188.5';document.getElementById('scoreArc').style.stroke='#c9973a';
  document.getElementById('paramGrid').innerHTML='';
  document.getElementById('suggestionList').innerHTML='';
  document.getElementById('tipBox').innerHTML='<strong>提示：</strong>完成錄音分析後，此處會顯示針對您嗓音的個人化建議。';
  if(radarChart){radarChart.data.datasets[0].data=[0,0,0,0,0,0];radarChart.update();}
}

// ═══════════════════════════════════════════════════════════
// PAGE NAV
// ═══════════════════════════════════════════════════════════
function switchPage(name,navBtn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  navBtn.classList.add('active');
  document.getElementById('scrollArea').scrollTop=0;
  if(name==='viz')    setTimeout(resizeAll,100);
  if(name==='score')  setTimeout(()=>{if(radarChart)radarChart.resize();},100);
  if(name==='exercises')setTimeout(()=>{resizeC(ktvC);},100);
}
</script>
